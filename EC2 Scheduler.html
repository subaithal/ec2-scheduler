<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CloudPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a flight-deck console. Dark navy stage + instrument-style readouts beside a quiet working surface.
   Sign-in is a split screen: scheduled-hours timeline on the left, form on the right. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --line: #dce2ee;
  --ink: #0f1a2e;
  --ink-2: #4a5873;
  --ink-3: #5f6d88;
  --accent: #2f5bd9;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaff;
  --side: #0e1830;
  --side-ink: #aebbd6;
  --side-active: #1a2a50;
  --side-line: #1f3058;
  --ok: #1d7f47;
  --ok-soft: #ddf2e5;
  --warn: #9a5a08;
  --warn-soft: #fbead0;
  --crit: #b3382c;
  --crit-soft: #fbe3e0;
  --save: #b8780f;
  --stage-bg: #0c1630;
  --stage-ink: #e8eefc;
  --stage-ink-2: #9fb0d3;
  --stage-line: rgba(255,255,255,0.08);
  --stage-bar: #6b92ff;
  --stage-off: rgba(255,255,255,0.05);
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1020; --surface: #101a30; --surface-2: #16223e; --line: #243456;
    --ink: #e7edfb; --ink-2: #a6b4d2; --ink-3: #7384a8;
    --accent: #6b92ff; --accent-ink: #071233; --accent-soft: #172a5a;
    --side: #080e1e; --side-ink: #8fa0c4; --side-active: #15234a; --side-line: #16213f;
    --ok: #4cc58a; --ok-soft: #12351f; --warn: #e5a04a; --warn-soft: #3a2a10;
    --crit: #ef7d70; --crit-soft: #3d1b17; --save: #e5a94a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1020; --surface: #101a30; --surface-2: #16223e; --line: #243456;
  --ink: #e7edfb; --ink-2: #a6b4d2; --ink-3: #7384a8;
  --accent: #6b92ff; --accent-ink: #071233; --accent-soft: #172a5a;
  --side: #080e1e; --side-ink: #8fa0c4; --side-active: #15234a; --side-line: #16213f;
  --ok: #4cc58a; --ok-soft: #12351f; --warn: #e5a04a; --warn-soft: #3a2a10;
  --crit: #ef7d70; --crit-soft: #3d1b17; --save: #e5a94a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
}
button, input, select { font-family: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons & form controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent;
  font-size: 13px; font-weight: 600; background: transparent; color: var(--ink);
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { border-color: var(--line); background: var(--surface); color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12px; }
.btn.start { background: var(--ok-soft); color: var(--ok); }
.btn.stop { background: var(--warn-soft); color: var(--warn); }
.btn.danger { background: var(--crit-soft); color: var(--crit); }
.btn.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.link:hover { text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.input, .select {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px;
}
.input::placeholder { color: var(--ink-3); }
.input:hover, .select:hover { border-color: var(--ink-3); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input.sm, .select.sm { height: 34px; font-size: 13px; }
.pw { position: relative; }
.pw .input { padding-right: 44px; }
.pw button {
  position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border: 0; border-radius: 5px;
  background: transparent; color: var(--ink-3); display: grid; place-items: center;
}
.pw button:hover { color: var(--ink); background: var(--surface-2); }
.pw svg { width: 18px; height: 18px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

/* ---------- Sign-in ---------- */
.login { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100dvh; background: var(--bg); }
.stage {
  position: relative; overflow: hidden; background: var(--stage-bg); color: var(--stage-ink);
  padding: clamp(24px, 4vw, 56px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
  background-image:
    linear-gradient(var(--stage-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--stage-line) 1px, transparent 1px);
  background-size: 44px 44px;
}
.stage .logo { display: flex; align-items: center; gap: 11px; }
.logo .mark { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.2px; display: block; line-height: 1.1; }
.logo small { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--stage-ink-2); }
.pitch h2 {
  font-size: clamp(30px, 3.6vw, 48px); line-height: 1.04; font-weight: 700; letter-spacing: -0.03em; max-width: 14em; color: var(--stage-ink);
}
.pitch p { margin-top: 16px; max-width: 34em; color: var(--stage-ink-2); font-size: 15px; }
.timeline { background: rgba(5, 10, 24, 0.72); border: 1px solid var(--stage-line); border-radius: 10px; padding: 18px 18px 14px; }
.tl-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--stage-ink-2); letter-spacing: 0.4px; }
.tl-head b { color: var(--stage-ink); font-weight: 500; }
.tl-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 7px 0; }
.tl-name { font-size: 12px; color: var(--stage-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-track {
  display: grid; grid-template-columns: repeat(24, 1fr); height: 14px; border-radius: 3px; background: var(--stage-off);
  background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,0.05) 4px 5px);
}
.tl-track i { background: var(--stage-bar); border-radius: 3px; height: 100%; }
.tl-off { font-family: var(--font-mono); font-size: 11px; color: var(--stage-ink-2); text-align: right; }
.tl-axis { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 12px; margin-top: 4px; }
.tl-axis div { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--stage-ink-2); }
.tl-foot { margin-top: 12px; font-size: 12px; color: var(--stage-ink-2); }

.formside { display: grid; place-items: center; padding: 40px 16px; }
.formcard { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px; }
.formcard h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.formcard .sub { color: var(--ink-2); margin-top: 8px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.formrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.form .btn.primary { height: 42px; font-size: 14px; }
.formerr { display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: 6px; background: var(--crit-soft); color: var(--crit); font-size: 13px; }
.formerr svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.forminfo { padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
.demobox { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.demobox .t { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); }
.demobox dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 12px; }
.demobox dt { color: var(--ink-3); }
.demobox dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }
.side {
  background: var(--side); color: var(--side-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; height: 100dvh; align-self: start;
}
.side .logo { padding: 2px 8px 26px; color: #fff; }
.side .logo small { color: var(--side-ink); }
.navlabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.navbtn {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px 10px; border: 0; border-radius: 6px;
  background: transparent; color: var(--side-ink); font-size: 13.5px; font-weight: 500; position: relative; white-space: nowrap;
}
.navbtn svg { width: 18px; height: 18px; flex: none; }
.navbtn:hover { background: var(--side-active); color: #fff; }
.navbtn.active { background: var(--side-active); color: #fff; }
.navbtn.active::before { content: ''; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.who { margin-top: auto; border-top: 1px solid var(--side-line); padding: 16px 6px 0; display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
.who .meta { min-width: 0; flex: 1; }
.who .meta b { display: block; color: #fff; font-size: 13px; font-weight: 600; }
.who .meta small { display: block; color: var(--side-ink); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 32px; height: 32px; flex: none; border: 0; border-radius: 6px; background: transparent; color: var(--side-ink); display: grid; place-items: center; }
.iconbtn:hover { background: var(--side-active); color: #fff; }
.iconbtn svg { width: 18px; height: 18px; }

.main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 20px; max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.pagehead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.crumb { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3); }
.pagehead h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 6px; }
.pagehead p { color: var(--ink-2); margin-top: 6px; max-width: 46em; }
.headtools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 99px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .6px; background: var(--warn-soft); color: var(--warn); }
.mode i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.mode.aws { background: var(--ok-soft); color: var(--ok); }

.alert { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px; }
.alert.error { background: var(--crit-soft); color: var(--crit); }
.alert.success { background: var(--ok-soft); color: var(--ok); }
.alert button { background: none; border: 0; color: inherit; font-size: 12px; font-weight: 600; padding: 0; text-decoration: underline; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; overflow: hidden; }
.panelhead { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.panelhead h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.panelhead p { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters .input { width: 220px; }
.filters .select { width: 140px; }
.searchwrap { position: relative; }
.searchwrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.searchwrap .input { padding-left: 32px; }
.hint { font-size: 12px; color: var(--ink-3); padding: 0 20px 16px; }
.tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; background: var(--accent-soft); color: var(--accent); padding: 5px 8px; border-radius: 4px; }

/* readouts */
.readout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.readout > div { padding: 18px 20px; border-left: 1px solid var(--line); min-width: 0; }
.readout > div:first-child { border-left: 0; }
.readout .k { font-size: 12px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.readout .k i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.readout .v { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 8px; font-variant-numeric: tabular-nums; }
.readout .n { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.dot-ok { background: var(--ok); } .dot-warn { background: var(--save); } .dot-off { background: var(--ink-3); } .dot-acc { background: var(--accent); }

.fleet { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.fleet > section { padding: 22px 24px; min-width: 0; }
.fleet > section + section { border-left: 1px solid var(--line); background: var(--surface-2); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3); }
.bigmoney { font-family: var(--font-display); font-size: clamp(38px, 5vw, 56px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin: 10px 0 8px; font-variant-numeric: tabular-nums; }
.bigmoney em { font: 500 14px var(--font-mono); color: var(--ink-3); letter-spacing: 0; margin-left: 6px; font-style: normal; }
.save .bigmoney { color: var(--save); }
.fine { font-size: 12px; color: var(--ink-3); max-width: 38em; }
.fleetbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 18px 0 12px; background: var(--surface-2); }
.fleetbar i { display: block; min-width: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); padding: 11px 20px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
td { font-size: 13px; color: var(--ink-2); padding: 14px 20px; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td .nm { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; }
td .id { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.running { background: var(--ok-soft); color: var(--ok); }
.pill.stopped { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; margin-left: 8px; }
.cpu { display: inline-flex; align-items: center; gap: 10px; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter i.low { background: var(--save); }
.tablefoot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.empty { text-align: center; padding: 28px 20px; color: var(--ink-3); }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quick button { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; text-align: left; }
.quick button:hover { border-color: var(--accent); }
.quick svg { width: 18px; height: 18px; color: var(--accent); flex: none; }

/* schedules */
.scheduleform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 14px; align-items: end; padding: 0 20px 18px; }
.scheduleform .btn { height: 40px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); min-width: 0; }
.row .info { flex: 1; min-width: 0; }
.row .info b { display: block; color: var(--ink); font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.row .info small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.when { width: 74px; flex: none; font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--ink); }
.badge { height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
.badge.act-start { background: var(--ok-soft); color: var(--ok); }
.badge.act-stop { background: var(--warn-soft); color: var(--warn); }
.state-on { background: var(--ok-soft); color: var(--ok); }
.state-off { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.logicon { width: 32px; height: 32px; flex: none; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.logicon svg { width: 16px; height: 16px; }
.row time { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); text-align: right; }

<script type="text/babel" data-presets="react">
const { useEffect, useState } = React;

/* ---------------- In-browser stand-in for the Express demo API ---------------- */
const region = 'ap-south-1', RATE = 0.06, MONTH_HOURS = 720;
const store = {
  instances: [
    { id: 'i-demo-101', name: 'Development Server', type: 't3.micro', state: 'running', cpu: 4, region, environment: 'Development' },
    { id: 'i-demo-102', name: 'QA Testing', type: 't3.small', state: 'stopped', cpu: 0, region, environment: 'Testing' },
    { id: 'i-demo-103', name: 'Analytics Worker', type: 't3.medium', state: 'running', cpu: 7, region, environment: 'Production' },
    { id: 'i-demo-104', name: 'Staging API', type: 't3.small', state: 'running', cpu: 22, region, environment: 'Staging' },
  ],
  activity: [{ id: 1, time: new Date().toISOString(), action: 'Demo workspace initialized', instanceId: '—' }],
  schedules: [],
};
let seq = 1000;
function log(action, instanceId) {
  store.activity.unshift({ id: ++seq, time: new Date().toISOString(), action, instanceId });
  store.activity = store.activity.slice(0, 100);
}
const fail = (m) => { throw Error(m); };
async function req(path, options = {}) {
  await new Promise((r) => setTimeout(r, 120));
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const copy = (x) => JSON.parse(JSON.stringify(x));
  let m;
  if (method === 'GET' && path === '/instances') return copy(store.instances);
  if (method === 'GET' && path === '/dashboard') {
    const a = store.instances;
    const running = a.filter((x) => x.state === 'running').length;
    const idle = a.filter((x) => x.state === 'running' && x.cpu !== null && x.cpu < 10).length;
    return { total: a.length, running, stopped: a.filter((x) => x.state === 'stopped').length, idle,
      estimatedMonthly: running * MONTH_HOURS * RATE, estimatedSavings: idle * MONTH_HOURS * RATE, mode: 'Demo' };
  }
  if (method === 'GET' && path === '/activity') return copy(store.activity);
  if (method === 'GET' && path === '/schedules') return copy(store.schedules);
  if (method === 'POST' && (m = path.match(/^\/instances\/([^/]+)\/(\w+)$/))) {
    const [, id, action] = m;
    if (!['start', 'stop', 'reboot'].includes(action)) fail('Invalid action');
    const x = store.instances.find((i) => i.id === id) || fail('Instance not found');
    if (action !== 'reboot') x.state = action === 'start' ? 'running' : 'stopped';
    log(action.toUpperCase() + ' requested', id);
    return { ok: true, message: `${action} request accepted for ${id}` };
  }
  if (method === 'POST' && path === '/schedules') {
    const { instanceId, action, time, days } = body;
    if (!instanceId || !['start', 'stop'].includes(action) || !time) fail('Instance, action and time are required');
    const s = { id: ++seq, instanceId, action, time, days: days || 'Every day', enabled: true };
    store.schedules.unshift(s);
    log(`Schedule created: ${action} at ${time}`, instanceId);
    return s;
  }
  if (method === 'PATCH' && (m = path.match(/^\/schedules\/(\d+)$/))) {
    const s = store.schedules.find((x) => x.id === Number(m[1])) || fail('Schedule not found');
    s.enabled = !!body.enabled;
    return copy(s);
  }
  if (method === 'DELETE' && (m = path.match(/^\/schedules\/(\d+)$/))) {
    store.schedules = store.schedules.filter((x) => x.id !== Number(m[1]));
    return { ok: true };
  }
  fail('Not found');
}

function Login({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  function submit(e) {
    e.preventDefault();
    setInfo('');
    const mail = email.trim();
    if (!mail || !password) { setErr('Enter your email and password.'); return; }
    if (!/^\S+@\S+\.\S+$/.test(mail)) { setErr('Enter a valid email address, like name@company.com.'); return; }
    setErr('');
    setLoading(true);
    setTimeout(() => {
      // Demo workspace: any email and password is accepted.
      const local = mail.split('@')[0].replace(/[._-]+/g, ' ').trim();
      const name = local ? local.replace(/\b\w/g, (c) => c.toUpperCase()) : 'Admin';
      onLogin({ email: mail, name }, remember);
    }, 700);
  }
  function fillDemo() {
    setEmail(DEMO.email);
    setPassword(DEMO.password);
    setErr('');
    setInfo('');
  }

            <div><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
            <span />
          </div>

        </div>

      <section className="formside">
        <div className="formcard">
          <div>

          </div>
          <form className="form" onSubmit={submit} noValidate>
            {err && (
              <div className="formerr" role="alert" id="login-error">

            )}
            {info && <div className="forminfo" role="status">{info}</div>}

              <label htmlFor="login-email">Email</label>
              <input id="login-email" className="input" type="email" autoComplete="username" placeholder="name@company.com"
                value={email} onChange={(e) => setEmail(e.target.value)} aria-describedby={err ? 'login-error' : undefined} />
            </div>

              <label htmlFor="login-password">Password</label>

                <input id="login-password" className="input" type={show ? 'text' : 'password'} autoComplete="current-password" placeholder="Enter your password"
                  value={password} onChange={(e) => setPassword(e.target.value)} />

            </button>

  async function refresh() {
    try {
      setError('');
      let [a, b, c, d] = await Promise.all([req('/instances'), req('/dashboard'), req('/activity'), req('/schedules')]);
      setInstances(a); setDash(b); setLogs(c); setSchedules(d);

  useEffect(() => {
    refresh();
    let t = setInterval(refresh, 7000);
    return () => clearInterval(t);
  }, []);
  async function action(id, act) {

    try {
      await req(`/instances/${id}/${act}`, { method: 'POST' });

    } catch (e) { setError(e.message); } finally { setBusy(''); }

      await refresh();
    } catch (e) { setError(e.message); }

                <div className="field">
                  <label htmlFor="s-action">Action</label>
                  <select id="s-action" className="select" value={sched.action} onChange={(e) => setSched({ ...sched, action: e.target.value })}>
                    <option value="start">Start</option>
                    <option value="stop">Stop</option>
                  </select>
                </div>
                <div className="field">
                  <label htmlFor="s-time">Time</label>
                  <input id="s-time" className="input" type="time" value={sched.time} onChange={(e) => setSched({ ...sched, time: e.target.value })} />
                </div>
                <div className="field">
                  <label htmlFor="s-days">Repeat</label>
                  <select id="s-days" className="select" value={sched.days} onChange={(e) => setSched({ ...sched, days: e.target.value })}>
                    <option>Every day</option><option>Weekdays</option><option>Weekends</option><option>Once</option>
                  </select>
                </div>
                <button className="btn primary" type="submit">Add schedule</button>
              </form>
              <p className="hint">Demo schedules are stored in memory. They are not automatically executed and reset when the backend restarts.</p>
            </section>
            <section className="panel">
              <div className="panelhead">
                <div>
                  <h2>Schedule list</h2>
                  <p>{schedules.length} configured {schedules.length === 1 ? 'entry' : 'entries'}</p>
                </div>
              </div>
              {schedules.length ? (
                schedules.map((s) => (
                  <div className="row" key={s.id}>
                    <span className="when">{s.time}</span>
                    <div className="info">
                      <b>{instances.find((x) => x.id === s.instanceId)?.name || s.instanceId}</b>
                      <small><span className="mono">{s.instanceId}</span> · {s.days}</small>
                    </div>
                    <span className={'badge act-' + s.action}>{s.action}</span>
                    <span className={'pill ' + (s.enabled ? 'state-on' : 'state-off')} style={{ textTransform: 'none' }}>{s.enabled ? 'Enabled' : 'Paused'}</span>
                    <div className="rowbtns">
                      <button className="btn neutral sm" onClick={() => toggleSchedule(s)}>{s.enabled ? 'Pause' : 'Enable'}</button>
                      <button className="btn danger sm" onClick={() => deleteSchedule(s.id)}>Delete</button>
                    </div>
                  </div>
                ))
              ) : (
                <div className="empty" style={{ borderTop: '1px solid var(--line)' }}>No schedules yet. Create one above, for example stop Development Server at 19:00 on weekdays.</div>
              )}
            </section>
          </>
        )}

        {page === 'cost' && (
          <>
            <section className="panel readout" aria-label="Cost summary">
              {[
                ['Estimated monthly', money(dash?.estimatedMonthly), 'dot-acc', 'Illustrative compute estimate'],
                ['Potential savings', money(dash?.estimatedSavings), 'dot-warn', 'If idle candidates stop'],
                ['Running resources', dash?.running ?? '—', 'dot-ok', 'Currently active'],
                ['Idle candidates', dash?.idle ?? '—', 'dot-warn', 'Demo CPU under 10%'],
              ].map(([t, v, c, n]) => (
                <div key={t}>
                  <div className="k"><i className={c} />{t}</div>
                  <div className="v">{v}</div>
                  <div className="n">{n}</div>
                </div>
              ))}
            </section>
            <section className="panel">
              <div className="panelhead">
                <div>
                  <h2>Optimization opportunities</h2>
                  <p>Rule-based suggestions based on available instance state and demo CPU values.</p>
                </div>
              </div>
              {idleList.map((x) => (
                <div className="row opp" key={x.id}>
                  <div className="info">
                    <b>{x.name}</b>
                    <small><span className="mono">{x.id}</span> · CPU {x.cpu}% · {x.type}</small>
                    <small>Low observed demo CPU. Review workload before stopping.</small>
                  </div>
                  <div className="save-amt">{money(perInstance)}<small>per month</small></div>
                  <button className="btn stop sm" onClick={() => action(x.id, 'stop')} disabled={!!busy}>
                    {busy === x.id + 'stop' ? 'Working…' : 'Stop instance'}
                  </button>
                </div>
              ))}
              {!idleList.length && <div className="empty" style={{ borderTop: '1px solid var(--line)' }}>No idle candidates identified from current data.</div>}
              <p className="hint" style={{ paddingTop: 14, borderTop: '1px solid var(--line)' }}>
                Savings are approximate only. Actual AWS pricing depends on region, instance type, discounts, storage, data transfer, and billing details.
              </p>
            </section>
          </>
        )}

        {page === 'activity' && (
          <section className="panel">
            <div className="panelhead">
              <div>
                <h2>Activity history</h2>
                <p>Most recent 100 events in this running backend session.</p>
              </div>
            </div>
            {logs.map((x) => (
              <div className="row" key={x.id}>
                <span className="logicon"><Icon name="activity" /></span>
                <div className="info">
                  <b>{x.action}</b>
                  <small>Instance: <span className="mono">{x.instanceId}</span></small>
                </div>
                <time>{new Date(x.time).toLocaleString()}</time>
              </div>
            ))}
          </section>
        )}

        {page === 'settings' && (
          <section className="panel">
            <div className="panelhead"><div><h2>Workspace settings</h2></div></div>
            <div className="setting"><span>Signed in as</span><b>{user.email}</b></div>
            <div className="setting"><span>Connection mode</span><b>{dash?.mode || 'Loading'}</b></div>
            <div className="setting"><span>AWS region</span><b>{instances[0]?.region || 'ap-south-1'}</b></div>
            <div className="setting"><span>Refresh interval</span><b>7 seconds</b></div>
            <div className="setting"><span>Data persistence</span><b>In-memory demo data</b></div>
            <div className="setting" style={{ alignItems: 'center' }}>
              <span>Session</span>
              <button className="btn ghost sm" onClick={onLogout}><Icon name="logout" />Sign out</button>
            </div>
            <div className="noticebox">
              <b>Security note:</b> sign-in on this page is a front-end demo that accepts any email and password. It does not protect anything. For a real deployment, verify credentials on the backend, issue session tokens there, and configure AWS credentials on the backend only with least-privilege IAM permissions. Never place AWS secrets in React frontend code.
            </div>
          </section>
        )}
        <div className="foot">CloudPilot · Student project interface · Cost values are illustrative</div>
      </main>
    </div>
  );
}

function InstancePanel({ items, total, query, setQuery, filter, setFilter, action, busy }) {
  return (
    <section className="panel">
      <div className="panelhead">
        <div>
          <h2>EC2 instances</h2>
          <p>Review status and manage lifecycle actions.</p>
        </div>
        <div className="filters">
          <div className="searchwrap">
            <Icon name="search" />
            <label className="sr" htmlFor="inst-search">Search instances</label>
            <input id="inst-search" className="input sm" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search instances" />
          </div>
          <label className="sr" htmlFor="inst-filter">Filter by state</label>
          <select id="inst-filter" className="select sm" value={filter} onChange={(e) => setFilter(e.target.value)}>
            <option value="all">All states</option>
            <option value="running">Running</option>
            <option value="stopped">Stopped</option>
          </select>
        </div>
      </div>
      <div className="tablewrap">
        <table>
          <thead>
            <tr><th>Instance</th><th>Type</th><th>Environment</th><th>State</th><th>CPU</th><th>Region</th><th>Actions</th></tr>
          </thead>
          <tbody>
            {items.map((x) => (
              <tr key={x.id}>
                <td><span className="nm">{x.name}</span><span className="id">{x.id}</span></td>
                <td className="mono">{x.type}</td>
                <td><span className="chip">{x.environment || '—'}</span></td>
                <td><span className={'pill ' + x.state}><i />{x.state}</span></td>
                <td>
                  {x.state === 'running' && x.cpu !== null ? (
                    <span className="cpu">
                      <span className="meter" aria-hidden="true"><i className={isIdle(x) ? 'low' : ''} style={{ width: Math.max(3, x.cpu) + '%' }} /></span>
                      <span className="mono">{x.cpu}%</span>
                      {isIdle(x) && <span className="chip warn">Idle</span>}
                    </span>
                  ) : '—'}
                </td>
                <td className="mono">{x.region}</td>
                <td>
                  {x.state === 'running' ? (
                    <button className="btn stop sm" disabled={!!busy} onClick={() => action(x.id, 'stop')}>
                      {busy === x.id + 'stop' ? 'Working…' : <><Icon name="stop" />Stop</>}
                    </button>
                  ) : (
                    <button className="btn start sm" disabled={!!busy} onClick={() => action(x.id, 'start')}>
                      {busy === x.id + 'start' ? 'Working…' : <><Icon name="play" />Start</>}
                    </button>
                  )}
                </td>
              </tr>
            ))}
            {!items.length && (
              <tr><td colSpan="7" className="empty">No instances match your search.</td></tr>
            )}
          </tbody>
        </table>
      </div>
      <div className="tablefoot">
        <span>Showing {items.length} of {total} instances</span>
        <span>Auto-refreshes every 7 seconds</span>
      </div>
    </section>
  );
}

/* ---------------- Root with session ---------------- */
const SESSION_KEY = 'cloudpilot_session';
function readSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    const u = raw ? JSON.parse(raw) : null;
    // Ignore a saved session that is missing the fields the dashboard needs.
    return u && typeof u.name === 'string' && u.name && typeof u.email === 'string' ? u : null;
  } catch (e) { return null; }
}
class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  render() {
    if (!this.state.failed) return this.props.children;
    return (
      <div className="formside" style={{ minHeight: '100dvh' }}>
        <div className="formcard">
          <h1>Something went wrong</h1>
          <p className="sub">CloudPilot hit an unexpected problem. Clearing the saved session and reloading usually fixes it.</p>
          <button className="btn primary" onClick={() => { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} location.reload(); }}>Reset and reload</button>
        </div>
      </div>
    );
  }
}
function Root() {
  const [user, setUser] = useState(readSession);
  function login(u, remember) {
    try {
      if (remember) localStorage.setItem(SESSION_KEY, JSON.stringify(u));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
    setUser(u);
  }
  function logout() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    setUser(null);
  }
  return user ? <Dashboard user={user} onLogout={logout} /> : <Login onLogin={login} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><Root /></Boundary>);
</script>
